[workspace]
resolver = "2"
members = [
    "crates/ledger-core",
    "crates/ledger-exchange",
    "crates/ledger-agents",
    "crates/ledger-ingest",
    "crates/ledger-jev",
    "crates/ledger-spec",
    "crates/ledger-store",
    "crates/ledger-api",
]
# Nested workspace. Cargo rejects a workspace inside a workspace, so the
# vendored Sentinel tree keeps its own [workspace] and is not a member here.
exclude = ["vendor/sentinel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Pre-existing Sentinel code, vendored in this repo (vendored in this repo).
sentinel-model = { path = "vendor/sentinel/model" }
sentinel-compile = { path = "vendor/sentinel/compile" }
sentinel-core = { path = "vendor/sentinel/core" }

ledger-core = { path = "crates/ledger-core" }
ledger-exchange = { path = "crates/ledger-exchange" }
ledger-agents = { path = "crates/ledger-agents" }
ledger-ingest = { path = "crates/ledger-ingest" }
ledger-jev = { path = "crates/ledger-jev" }
ledger-spec = { path = "crates/ledger-spec" }
ledger-store = { path = "crates/ledger-store" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = "1"
# `tracing` enables sentry-tracing. `logs` enables structured logs (also a default).
sentry = { version = "0.49", features = ["tracing", "logs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

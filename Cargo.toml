[workspace]
resolver = "2"
members = [
    "crates/ledger-core",
    "crates/ledger-exchange",
    "crates/ledger-agents",
    "crates/ledger-ingest",
    "crates/ledger-jev",
    "crates/ledger-spec",
    "crates/ledger-store",
    "crates/ledger-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Pre-existing Sentinel code, consumed by path (see README "Disclosure").
sentinel-model = { path = "/Users/arnabghosh/Desktop/emet/sentinel/model" }
sentinel-compile = { path = "/Users/arnabghosh/Desktop/emet/sentinel/compile" }
sentinel-core = { path = "/Users/arnabghosh/Desktop/emet/sentinel/core" }

ledger-core = { path = "crates/ledger-core" }
ledger-exchange = { path = "crates/ledger-exchange" }
ledger-agents = { path = "crates/ledger-agents" }
ledger-ingest = { path = "crates/ledger-ingest" }
ledger-jev = { path = "crates/ledger-jev" }
ledger-spec = { path = "crates/ledger-spec" }
ledger-store = { path = "crates/ledger-store" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
